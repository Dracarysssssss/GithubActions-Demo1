name: Github Actions Demo
on:
  push:

jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v3
        - name: Set up Node.js
          uses: actions/setup-node@v3
          with:
            node-version: '18'
        - name: Install dependencies
          run: npm install
        - name: Linting
          run: npx eslint --ext .jsx --fix src
        - name: Testing
          run: npm run test
        - name: Build
          run: npm run build


